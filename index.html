<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RSP Media Manager</title>
  <link rel="icon" href="Assets/Favicon.png">
  <link rel="stylesheet" id="publicSourcesStyles" href="Sources/styles.css?v=20260727-storage-ui-continue-watching">
</head>
<body>
  <header class="sources-main-toolbar">
    <a class="sources-brand" href="index.html" aria-label="RSP Media Manager home">
      <img src="Assets/Favicon.png" alt="">
      <span>RSP Media Manager</span>
    </a>
    <nav class="sources-nav" aria-label="Main navigation">
      <a class="sources-nav-button is-active" href="index.html" aria-label="Public sources" title="Public sources" aria-current="page">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 4h6v6H4V4Zm10 0h6v6h-6V4ZM4 14h6v6H4v-6Zm10 0h6v6h-6v-6Z"/></svg>
      </a>
      <button class="sources-nav-button" id="customViewBtn" type="button" aria-label="Open custom view" title="Custom view">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4H10l2 2h6.5A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-10Zm9 3.5v2H9v2h3v3h2v-3h3v-2h-3v-2h-2Z"/></svg>
      </button>
      <a class="sources-nav-button sources-nav-button--secondary" href="Creator/index.html" aria-label="Create or modify a source" title="Create or modify">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15.7 4.3 4 4L9 19H5v-4L15.7 4.3Zm1.4-1.4a2 2 0 0 1 2.8 0l1.2 1.2a2 2 0 0 1 0 2.8l-.8.8-4-4 .8-.8Z"/></svg>
      </a>
      <a class="sources-nav-button sources-nav-button--secondary" href="Maintenance/index.html" aria-label="Library maintenance" title="Library maintenance">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m14.4 4.2 5.4 5.4-1.5 1.5-1.3-1.3-6.7 6.7-.5 2.6-2.6.5.5-2.6 6.7-6.7-1.3-1.3 1.3-1.3Zm-8.9 14h7v2h-7v-2Z"/></svg>
      </a>
    </nav>
    <div class="sources-toolbar-actions">
      <button id="sourcesSettingsBtn" title="Settings" aria-label="Settings">⚙</button>
    </div>
  </header>

  <main>
    <section id="continueWatchingSection" class="continue-watching-section" aria-labelledby="continueWatchingTitle" hidden>
      <h2 id="continueWatchingTitle">Continue watching</h2>
      <div id="continueWatchingGrid" class="continue-watching-grid"></div>
    </section>
    <div class="sources-search" id="sourcesToolbar">
      <label class="sr-only" for="sourcesSearchInput">Search public sources</label>
      <input
        type="search"
        id="sourcesSearchInput"
        name="sourcesSearchInput"
        placeholder="Search by title, file name, or poster URL"
        autocomplete="off"
      />
    </div>
    <div class="container" id="sourcesContainer">
      <!-- Cards will be injected here -->
    </div>
  </main>

  <div class="custom-view-overlay" id="customViewOverlay" hidden>
    <div class="custom-view-backdrop" data-custom-close></div>
    <section class="custom-view-dialog" role="dialog" aria-modal="true" aria-label="Custom view">
      <button class="custom-view-close" id="customViewCloseBtn" type="button" aria-label="Close custom view" title="Close">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6l5.6-5.6L5 6.4 6.4 5Z"/></svg>
      </button>
      <div class="custom-source-prompt" id="customSourcePrompt">
        <form id="customSourceForm">
          <label for="customSourceInput">Source file link or Catbox ID</label>
          <div class="custom-source-row">
            <input id="customSourceInput" type="text" required autocomplete="off" placeholder="https://example.com/source.json">
            <button type="submit">Open source</button>
          </div>
        </form>
      </div>
      <iframe id="customViewFrame" title="Open a custom media source" hidden></iframe>
    </section>
  </div>

  <footer class="sources-footer">
    <a href="https://github.com/RandomSideProjects/Media-Manager/blob/main/Sources/README.md" id="simpleSourceLink" target="_blank" rel="noopener">Simple Version</a>
  </footer>
  <script src="scripts/app-router.js?v=20260727-storage-ui-continue-watching-direct-item"></script>
  <script>
    (() => {
      const openButton = document.getElementById('customViewBtn');
      const overlay = document.getElementById('customViewOverlay');
      const closeButton = document.getElementById('customViewCloseBtn');
      const frame = document.getElementById('customViewFrame');
      const sourcePrompt = document.getElementById('customSourcePrompt');
      const sourceForm = document.getElementById('customSourceForm');
      const sourceInput = document.getElementById('customSourceInput');
      const background = [
        document.querySelector('.sources-main-toolbar'),
        document.querySelector('main'),
        document.querySelector('.sources-footer')
      ].filter(Boolean);
      if (!openButton || !overlay || !closeButton || !frame || !sourcePrompt || !sourceForm || !sourceInput) return;

      const closeOverlay = () => {
        overlay.hidden = true;
        document.body.classList.remove('custom-view-open');
        background.forEach((element) => element.removeAttribute('inert'));
        openButton.setAttribute('aria-expanded', 'false');
        openButton.focus();
      };

      const openOverlay = (focusTarget = closeButton) => {
        overlay.hidden = false;
        document.body.classList.add('custom-view-open');
        background.forEach((element) => element.setAttribute('inert', ''));
        openButton.setAttribute('aria-expanded', 'true');
        focusTarget.focus();
      };

      window.openCustomViewPath = (path) => {
        const target = typeof path === 'string' ? path.trim() : '';
        if (!target) return;
        const targetUrl = new URL(target, window.location.href);
        if (!(targetUrl.searchParams.get('source') || '').trim()) return;
        frame.setAttribute('src', target);
        sourcePrompt.hidden = true;
        frame.hidden = false;
        openOverlay();
      };

      const openSourcePrompt = () => {
        frame.hidden = true;
        sourcePrompt.hidden = false;
        openOverlay(sourceInput);
      };

      sourceForm.addEventListener('submit', (event) => {
        event.preventDefault();
        const source = sourceInput.value.trim();
        if (!source) return;
        const params = new URLSearchParams({ source, embed: '1' });
        window.openCustomViewPath(`index.html?${params.toString()}`);
      });

      const getFrameFocusable = () => {
        try {
          return Array.from(frame.contentDocument.querySelectorAll(
            'button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), a[href], [tabindex]:not([tabindex="-1"])'
          )).filter((element) => element.offsetParent !== null);
        } catch {
          return [];
        }
      };

      frame.addEventListener('load', () => {
        try {
          frame.contentDocument.addEventListener('keydown', (event) => {
            if (event.key !== 'Tab') return;
            const focusable = getFrameFocusable();
            if (!focusable.length) {
              event.preventDefault();
              closeButton.focus();
              return;
            }
            const first = focusable[0];
            const last = focusable[focusable.length - 1];
            if (event.shiftKey && frame.contentDocument.activeElement === first) {
              event.preventDefault();
              closeButton.focus();
            } else if (!event.shiftKey && frame.contentDocument.activeElement === last) {
              event.preventDefault();
              closeButton.focus();
            }
          });
        } catch {}
      });

      openButton.setAttribute('aria-expanded', 'false');
      openButton.addEventListener('click', openSourcePrompt);
      closeButton.addEventListener('click', closeOverlay);
      overlay.querySelector('[data-custom-close]').addEventListener('click', closeOverlay);
      document.addEventListener('keydown', (event) => {
        if (overlay.hidden) return;
        if (event.key === 'Escape') {
          closeOverlay();
          return;
        }
        if (event.key === 'Tab' && document.activeElement === closeButton) {
          event.preventDefault();
          if (!sourcePrompt.hidden) {
            sourceInput.focus();
            return;
          }
          const focusable = getFrameFocusable();
          if (focusable.length) focusable[event.shiftKey ? focusable.length - 1 : 0].focus();
          else frame.focus();
        }
      });
    })();
  </script>
</body>
</html>
